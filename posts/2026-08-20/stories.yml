- title: "OpenRouter is joining Stripe"
  date: "2026-08-20"
  categories: [m-and-a, ai-infra]
  tags: [m-and-a, ai-infra, openrouter, stripe, llm-gateway]
  source: "HN"
  domain: "openrouter.ai"
  link: "https://openrouter.ai/blog/announcements/openrouter-is-joining-stripe/"
  tldr:
    - "OpenRouter, the largest AI model marketplace and gateway, is joining forces with Stripe. It processes 10+ trillion tokens per day from 400+ AI models for a community of over 10 million developers and companies, with at least 10x inference growth every year. The announced plan is to keep operating exactly as before — same mission, name, product, and roadmap — so existing integrations do not change."
    - "The pairing is framed around shared DNA: both abstract complex infrastructure into clean developer APIs. Stripe brings a large customer network, trust, fraud/abuse tooling, and global infrastructure experience, which OpenRouter argues will matter more as AI abuse grows. The deal is subject to customary closing conditions, expected to close in the coming weeks."
  why: "The gateway you likely route models through is being acquired by the payments platform that sets the developer-API standard. Nothing changes for builders today, but it signals where neutral multi-model routing is headed — and it is the #2 story on the HN front page this morning."
  highlights: [10T tokens/day, Stripe acquisition, neutral routing]
- title: "Don't Paste the AI, please"
  date: "2026-08-20"
  categories: [ai, communication]
  tags: [ai, communication, llm, productivity]
  source: "HN"
  domain: "dontpastetheai.com"
  link: "https://dontpastetheai.com/"
  tldr:
    - "A short site making one pointed argument: when someone asks you a question, they want your answer, not an unedited wall of chatbot output. The person on the other side has the same tools you do — if they wanted the generic answer they would have gotten it in four seconds. They asked you because they wanted your context, your taste, your judgement."
    - "The suggested alternative: use the AI as a drafting partner, read what it gives you, then write your own take. Pull out the bit that actually answers the question and drop the rest — three sentences from you beat a long paste. If a piece of the model's answer is genuinely useful, quote it and say why. And if you have nothing to add, 'no strong opinion here' is a real, helpful reply."
  why: "The #1 story on the HN front page this morning — a sharp reminder about the difference between relaying model output and adding actual judgment. Relevant as a checkpoint for how AI-assisted work gets communicated."
  highlights: ["#1 on HN", drafting partner, judgment over volume]

- title: "An LLM is an unreliable analyst but a useful instrument for iOS location traffic"
  date: "2026-10-15"
  categories: [network-intelligence, llm]
  tags: [traffic-analysis, llm, privacy, packet-inspection, methodology]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2610.21597"
  tldr:
    - "This study examines what Apple's iOS location services send over the network and how well a large language model (LLM) can analyse that traffic. The authors find the model unreliable as an autonomous analyst — it misreads or over-interprets raw traffic — but useful as an instrument when paired with deterministic parsing."
    - "The result is a methodological caution for LLM-based traffic analysis: use the model for interpretation and summarisation, not as the source of ground truth about packets."
  why: "A grounded, sceptical result on LLM-driven packet and traffic analysis — exactly the tool-use boundary worth knowing before wiring an LLM into a packet-analysis pipeline."
  highlights: [LLM traffic-analysis limits, deterministic parsing, privacy]

- title: "Backdooring open-weight AI models"
  date: "2026-10-15"
  categories: [ai-security, open-weights]
  tags: [backdoor, supply-chain, open-weights, model-integrity, security]
  source: "Schneier"
  domain: "schneier.com"
  link: "https://www.schneier.com/blog/archives/2026/10/backdooring-open-weight-ai-models.html"
  tldr:
    - "Bruce Schneier discusses research showing that open-weight models can be backdoored — poisoned during training or fine-tuning so they behave normally except under a specific trigger — and that such backdoors survive the distribution of the weights."
    - "The practical consequence is a supply-chain problem: downloading and self-hosting open weights does not by itself guarantee the model is trustworthy, so provenance and verification of model artefacts matter as much as they do for any other software dependency."
  why: "Directly relevant to anyone running local or open-weight models in-house: the security question is not only whether the model can leak data, but whether the weights themselves can be trusted."
  highlights: [model backdoors, weight supply chain, trigger behaviour]

- title: "Poisoning the neighborhood: a topology-aware attack on HNSW-based RAG"
  date: "2026-10-15"
  categories: [ai-security, structured-rag]
  tags: [rag, vector-search, hnsw, data-poisoning, retrieval-attack]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2610.21464"
  tldr:
    - "Retrieval-augmented generation (RAG) systems typically retrieve evidence from a vector index built with an approximate-nearest-neighbour graph such as Hierarchical Navigable Small World (HNSW). This paper shows a topology-aware poisoning attack that exploits the graph structure itself, injecting a small number of crafted documents to steer which neighbours a query reaches."
    - "Because the attack targets the index topology rather than the embedding space alone, it can distort retrieval for many queries while remaining hard to spot in the stored corpus."
  why: "A concrete attack on the retrieval layer of RAG — a reminder that the vector index is part of the attack surface, not just the documents and the prompt."
  highlights: [HNSW index topology, retrieval poisoning, RAG attack surface]

- title: "GitLab Duo agent prompt-injection flaw (CVE-2026-96893)"
  date: "2026-10-14"
  categories: [ai-security, llm-agents]
  tags: [prompt-injection, coding-agent, cve, ci-cd, security-boundary]
  source: "Penligent"
  domain: "penligent.ai"
  link: "https://www.penligent.ai/hackinglabs/pt/cve-2026-96893/"
  tldr:
    - "CVE-2026-96893 is a prompt-injection vulnerability in GitLab's Duo AI coding assistant, where untrusted content the agent processes can steer it into actions across the boundary between the assistant and the development environment it controls."
    - "The write-up argues that this boundary — between an AI coding assistant and the repositories, pipelines, and credentials it can reach — is becoming one of the most important attack surfaces in software delivery."
  why: "A real, assigned vulnerability in an agentic coding tool: a useful case study of how prompt injection turns into concrete actions inside a continuous-integration environment."
  highlights: [prompt injection, agent-CI/CD boundary, CVE case study]

- title: "Meta releases Muse Spark Open, an 816B open-weight MoE that runs on Macs"
  date: "2026-10-15"
  categories: [open-weights, local-llm, llm]
  tags: [open-weights, mixture-of-experts, local-inference, agentic, long-context]
  source: "Hugging Face"
  domain: "huggingface.co"
  link: "https://huggingface.co/blog/meta-muse-spark-open"
  tldr:
    - "Meta released Muse Spark Open, the open-weight version of its Muse Spark model: a natively multimodal sparse mixture-of-experts (MoE) model with 816 billion total parameters that activate roughly 42 billion per token, and a context window of up to one million tokens. It is positioned for coding and long-horizon agentic work."
    - "Weights ship in BF16 and NVFP4 formats, with inference kernels and fine-tuning support released alongside. The model can be run locally on high-memory Apple hardware, though the full-precision footprint needs a serious machine."

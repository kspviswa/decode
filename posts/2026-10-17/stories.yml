- title: "Does quantization hurt coding agents? A deep dive with numbers"
  date: "2026-10-13"
  categories: [local-llm, benchmarks, llm-agents]
  tags: [quantization, coding-agents, evaluation, local-inference, tool-calling]
  source: "imec"
  domain: "aistack.imec-int.com"
  link: "https://aistack.imec-int.com/blog/quantization"
  tldr:
    - "This study measures how quantizing a model — reducing the precision of its weights to save memory — affects the performance of coding agents specifically, rather than on generic benchmarks. It reports results across quantization levels with the actual numbers behind each trade-off."
    - "The finding that matters for local deployment is that agentic, tool-calling workloads degrade differently from plain text generation, so a quantization setting that looks fine on a chat benchmark may not hold up inside an agent loop."
  why: "Practical, measured guidance for anyone running coding agents on local or self-hosted hardware: quantize for memory, but evaluate on the agent task, not the chat benchmark."
  highlights: [quantization trade-offs, agent-specific evaluation, tool calling]

- title: "Underdog Saluki 27B: a 7.89 GB quantization tuned for tool calling"
  date: "2026-10-14"
  categories: [open-weights, local-llm]
  tags: [quantization, tool-calling, open-weights, local-inference, gguf]
  source: "Hugging Face"
  domain: "huggingface.co"
  link: "https://huggingface.co/ConwayResearch/Underdog-Saluki-27B-1.0"
  tldr:
    - "Underdog Saluki 27B is a 27-billion-parameter open-weight model released as a 7.89 GB quantization, deliberately compressed so it fits in modest local memory while preserving tool-calling behaviour."
    - "The release targets the common local-agent use case: a model small enough to run on a single consumer GPU or a laptop, but tuned for the structured output that tool use requires."
  why: "A concrete data point on how far quantization can be pushed while keeping tool calling usable — relevant when choosing a local model to sit behind an agent."
  highlights: [7.89 GB footprint, tool-calling focus, 27B parameters]

- title: "When the KV cache is slower than the GPU: scaling remote KV tiers"
  date: "2026-10-15"
  categories: [ai-infra, edge-inference, llm]
  tags: [kv-cache, distributed-inference, prefill, context-parallel, serving]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2610.21500"
  tldr:
    - "For long-context inference, the key-value (KV) cache that stores attention state can grow large enough that moving it, rather than computing, becomes the bottleneck. This paper studies scaling remote KV tiers for context-parallel prefill, where the cache is offloaded to remote storage or memory."
    - "The results characterise when the remote KV tier is slower than keeping everything on the graphics processing unit (GPU), giving a cost model for deciding how to distribute the cache across a fleet."
  why: "A systems-level treatment of the KV cache as a distributed resource — the infrastructure question behind serving long-context models at scale."
  highlights: [remote KV tiers, context-parallel prefill, cache cost model]
  mermaid: "flowchart LR\n  Q[Query] --> P[Prefill on GPU]\n  P --> KV[KV cache]\n  KV -->|keep| G[GPU memory]\n  KV -->|offload| R[Remote KV tier]\n  G --> D[Decode]\n  R --> D"

- title: "China drafts export controls on AI models and model weights"
  date: "2026-10-16"
  categories: [m-and-a]
  tags: [export-controls, model-weights, policy, open-weights, china]
  source: "Taipei Times"
  domain: "taipeitimes.com"
  link: "https://www.taipeitimes.com/News/biz/archives/2026/10/17/2003866098"
  tldr:
    - "China's Ministry of Commerce and Ministry of Science and Technology published a draft revision of the national export-control catalogue on 16 October, proposing to add 23 artificial-intelligence technologies — including the weights of very large models — to the restricted list."
    - "Under the draft, releasing the weights of models above a size threshold, or models ranked near the global frontier, would require approval. Ordinary application programming interface (API) access and many open-source releases would stay outside the strictest controls. The draft is open for comment until mid-November."
  why: "Model weights are now being treated as an export-controlled technology — a structural change that affects how open-weight releases are distributed and where they can be hosted."
  highlights: [23 AI technologies, weight-release licensing, comment window]

- title: "Open weight takes 71.5% of tokens but only 23% of spend"
  date: "2026-10-16"
  categories: [m-and-a]
  tags: [open-weights, economics, inference-cost, gateway, market-data]
  source: "Vercel"
  domain: "vercel.com"
  link: "https://vercel.com/blog/ai-gateway-production-index-october-2026"
  tldr:
    - "Vercel's AI Gateway production index reports that open-weight models now account for 71.5% of tokens served through its gateway but only 23% of spend, because their per-token prices are far lower than those of proprietary frontier models."
    - "The gap quantifies the economics driving the shift to open weights: the same work, routed to a cheaper model, moves most of the volume while leaving most of the revenue with the closed frontier."
  why: "Hard numbers on the open-versus-closed economics of inference — useful context for deciding where to route workloads and what the price gap actually looks like in production."
  highlights: [71.5% of tokens, 23% of spend, routing economics]

- title: "Configuring RAG systems: what breaks, where it originates, and how to fix it"
  date: "2026-10-13"
  categories: [structured-rag, retrieval]
  tags: [rag, configuration, failure-analysis, retrieval, debugging]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2610.18567"
  tldr:
    - "Retrieval-augmented generation (RAG) systems have many knobs — chunk size, embedding model, number of retrieved passages, reranking — and this paper studies what actually breaks when they are misconfigured, tracing each failure back to its origin in the pipeline."
    - "Rather than proposing yet another architecture, it offers a diagnostic map: which symptoms point to which stage, and which fixes address the root cause rather than masking it."
  why: "A debugging-oriented treatment of structured RAG — the practical counterpart to the steady stream of new RAG architectures, and useful when a pipeline underperforms and the cause is unclear."
  highlights: [failure taxonomy, pipeline diagnostics, configuration knobs]

- title: "Time-traveling agents: letting AI ship reliable distributed systems"
  date: "2026-10-14"
  categories: [distributed-systems, agents]
  tags: [distributed-systems, testing, determinism, agents, verification]
  source: "Antithesis"
  domain: "antithesis.com"
  link: "https://antithesis.com/blog/2026/time-traveling-agents/"
  tldr:
    - "Antithesis describes using AI agents inside its deterministic-simulation testing platform, where the entire system can be paused, rewound, and replayed. That determinism lets an agent replay a failure exactly, inspect the state at any point, and test a proposed fix against the same execution."
    - "The combination addresses a longstanding problem in distributed-systems debugging: failures that are rare, timing-dependent, and hard to reproduce, which agents otherwise struggle to reason about."
  why: "A concrete way to make agentic debugging tractable for distributed systems — determinism plus replay turns a flaky failure into something an agent can actually iterate on."
  highlights: [deterministic replay, agent-driven debugging, reproducible failures]

- title: "Learning self-orchestration in decentralized agent swarms"
  date: "2026-10-15"
  categories: [agents, multi-agent]
  tags: [multi-agent, orchestration, decentralized, swarms, coordination]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2610.22322"
  tldr:
    - "This paper studies how a swarm of agents can learn to orchestrate itself — deciding who does what and when — without a central controller handing out assignments. The agents learn coordination policies that let the group adapt as tasks and membership change."
    - "Decentralised orchestration is the harder version of the multi-agent problem: it trades the simplicity of a central planner for robustness when no single agent has a full view of the system."
  why: "Multi-agent coordination without a central controller is the architecture that scales to real, failure-prone systems — and a direct read on where agent research is heading."
  highlights: [decentralized orchestration, learned coordination, swarm robustness]

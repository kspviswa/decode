- title: "Peering inside LLM-based multi-agent systems could expose stealthy attacks"
  date: "2026-08-26"
  categories: [ai-security, security]
  tags: [ai-security, security, multi-agent, icml]
  source: "Tech Xplore"
  domain: "techxplore.com"
  link: "https://techxplore.com/news/2026-08-peering-llm-based-multi-agent.html"
  tldr:
    - "A framework presented at ICML 2026 analyzes numerical signals produced inside individual LLMs to identify agents in a multi-agent system that may have been compromised — a way of detecting stealthy attacks that don't show up in the agents' visible outputs."
    - "It matters because multi-agent systems are increasingly used for high-stakes orchestration, and a single compromised agent can steer the whole system; internal-signal monitoring is a promising detector."
  why: "A concrete attack-detection technique for multi-agent systems — relevant to agent security and trustworthy multi-agent orchestration."
  highlights: [internal signals, compromised-agent detection, ICML 2026]
- title: "When str.lower() is a security vulnerability in Python"
  date: "2026-08-26"
  categories: [security]
  tags: [security, python, idna, unicode]
  source: "Seth Larson"
  domain: "sethmlarson.dev"
  link: "https://sethmlarson.dev/when-str-lower-is-a-security-vulnerability"
  tldr:
    - "A deep dive into how Unicode case-folding and Internationalized Domain Names (IDNA) interact with Python's str.lower(), and the cases where that interaction becomes a security vulnerability — particularly around domain-name normalization and authentication-relevant string comparisons."
    - "A clear reminder that string normalization is a security boundary, and that IDNA 2003 vs IDNA 2008 handling can diverge in ways that matter for security-sensitive code."
  why: "A precise, non-obvious security bug class in Unicode normalization — relevant to anyone doing domain or string comparisons in security-sensitive code."
  highlights: [IDNA, Unicode case-folding, normalization attacks]
- title: "LatticeDB: a single-file graph database with vector and full-text search for RAG apps"
  date: "2026-08-26"
  categories: [cloud-native, structured-rag]
  tags: [cloud-native, structured-rag, graph-db, embeddings]
  source: "GitHub"
  domain: "github.com"
  link: "https://github.com/jeffhajewski/latticedb"
  tldr:
    - "LatticeDB brings the single-file, embeddable, zero-config ethos of SQLite to graph databases, adding native vector similarity (HNSW) and BM25 full-text search over the same dataset in one query layer. It is aimed at relationship-heavy, local workloads like Graph RAG, agent memory, and knowledge tools."
    - "For structured RAG, the appeal is obvious: traverse relationships, run semantic search, and do full-text retrieval against one file, with a durable event log for consuming graph changes."
  why: "A practical, local-first graph database with vector + full-text search — directly relevant to structured RAG and agent-memory storage."
  highlights: [single-file graph DB, HNSW + BM25, Graph RAG]
- title: "Maiao: Gerrit-style code review workflow for GitHub, GitLab, and Gitea"
  date: "2026-08-26"
  categories: [cloud-native, distributed]
  tags: [cloud-native, distributed, code-review, dev-tools]
  source: "GitHub"
  domain: "github.com"
  link: "https://github.com/runetes/maiao"
  tldr:
    - "Maiao brings the Gerrit-style code review model — stacked changes, review-before-merge semantics, and a linear history — to GitHub, GitLab, and Gitea. It layers a review-first workflow on top of the host's existing PR/merge infrastructure."
    - "For teams that prefer a strict, stacked-commit review flow, it is a way to get Gerrit-like discipline without migrating away from their current forge."
  why: "A practical dev-tooling story about bringing Gerrit-style review workflows to mainstream forges — relevant to cloud-native development practice."
  highlights: [Gerrit-style review, stacked changes, multi-forge]
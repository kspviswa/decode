- title: "Ericsson and VodafoneThree switch on a cloud-native 5G core built for slicing"
  date: "2026-09-17"
  categories: [5g, 5g-core, network-intelligence]
  tags: [5g-sa, packet-core, network-slicing, cloud-native, mocn]
  source: "Ericsson"
  domain: "ericsson.com"
  link: "https://www.ericsson.com/en/press-releases/3/2026/ericsson-and-vodafonethree-begin-rollout-of-next-generation-5g-core-network"
  tldr:
    - "Ericsson and VodafoneThree have taken live a cloud-native 5G core in the United Kingdom. The core is powered by Ericsson's dual-mode 5G Core, which unifies 4G and 5G core functions on a single platform running on Ericsson's Cloud Native Infrastructure Solution, and is designed for 9 terabits per second of capacity — described as one of Europe's largest mobile packet cores. It serves 28.6 million customers."
    - "The core is the delivery engine for differentiated connectivity: two dedicated network slices — 5G+ FastTrack for consumers and a National Business Slice — provide up to four times faster speeds and a 15 Mbps minimum download guarantee inside 5G Standalone coverage. The rollout follows an earlier world-first unification of core-level sharing through Multi-Operator Core Network (MOCN) technology over a multi-vendor 4G and 5G radio network, now evolving into a single dedicated core."
  why: "A concrete, live deployment of a cloud-native packet core whose commercial value is delivered through network slicing — the clearest current example of the core as a programmable platform rather than a fixed appliance."
  highlights: [9 Tbps packet core, dual-mode 4G/5G core, MOCN to dedicated core]

- title: "Nokia and Microsoft build an agentic data foundation for network automation"
  date: "2026-09-17"
  categories: [network-intelligence, ai-agents, network-automation]
  tags: [agentic-ai, telecom-data, microsoft-fabric, autonomous-networks]
  source: "Nokia"
  domain: "nokia.com"
  link: "https://www.nokia.com/newsroom/nokia-accelerates-network-automation-through-agentic-unified-data-foundation-with-microsoft/"
  tldr:
    - "Nokia is extending its partnership with Microsoft to accelerate network automation, announcing the joint development of an agentic, unified data foundation that integrates Nokia Data Suite with Microsoft Fabric. The goal is to give AI agents a curated, trustworthy, real-time view of network data across multi-vendor environments."
    - "The announcement targets a well-known barrier to AI adoption in telecom: the time and effort required to prepare and operationalize network data before agents can reason over it. Nokia frames the data foundation as a prerequisite for higher levels of autonomous network operations."
  why: "Data readiness, not model choice, is the practical bottleneck for autonomous network management — this pairs a network vendor's data layer with a hyperscaler's data platform to attack it directly."
  highlights: [Nokia Data Suite, Microsoft Fabric, multi-vendor data readiness]

- title: "Field study: 72 hours of idle Android packets behind a pfSense firewall"
  date: "2026-09-19"
  categories: [network-intelligence, packet-analysis]
  tags: [pcap, telemetry, android, privacy, wireshark, network-analysis]
  source: "Praveen Tech World"
  domain: "praveentechworld.com"
  link: "https://www.praveentechworld.com/research/degoogle-telemetry-2026"
  tldr:
    - "A research team captured 72 continuous hours of network packets from three untouched Google Pixel 8 phones on an isolated Wi-Fi network behind an enterprise pfSense firewall running Wireshark, then analyzed the traffic to Alphabet's Autonomous System Number 15169. A stock Android device generated 348.4 outbound requests per hour while idle — roughly 8,300 background transmissions per day — versus 0.0 per hour on a GrapheneOS build with no Google services."
    - "The breakdown attributes most idle traffic to Google Play Services (142.6 requests/hour), location services uploading nearby Wi-Fi router identifiers for triangulation (84.2/hour), device provisioning of hardware fingerprints and SIM serials (48.0/hour), Photos sync tokens (28.5/hour), and a persistent push-notification heartbeat socket (14.8/hour). The raw CSV is released under a Creative Commons licence with timestamps, destination IPs, ports, and payload sizes."
  why: "A hands-on packet-capture (PCAP) study with a real dataset and reproducible test bench — useful both as a template for PCAP-driven network analysis and as evidence of what idle devices actually put on the wire."
  highlights: [348.4 idle requests/hour, 42 endpoints, CC BY 4.0 packet dataset]

- title: "Microsoft patches a CVSS 10.0 Azure AI Foundry flaw (CVE-2026-85889)"
  date: "2026-09-18"
  categories: [security, ai-security]
  tags: [cve, azure-ai-foundry, privilege-escalation, cloud-security, copilot]
  source: "The Hacker News"
  domain: "thehackernews.com"
  link: "https://thehackernews.com/2026/09/microsoft-patches-cvss-100-azure-ai.html"
  tldr:
    - "Microsoft has released fixes for a maximum-severity vulnerability in Azure AI Foundry, tracked as CVE-2026-85889 and rated CVSS 10.0. The flaw is a missing authentication check for a critical function that allows an unauthorized attacker to elevate privileges over the network. There is no evidence of exploitation in the wild."
    - "The fix shipped alongside other critical cloud patches, including a 9.9 command-injection flaw in Microsoft 365 Copilot (CVE-2026-85885) and a 9.9 improper-authorization flaw in Azure Database for PostgreSQL (CVE-2026-85878). As is typical for cloud CVEs, Microsoft says the issues are already mitigated server-side and require no customer action."
  why: "A reminder that the AI platform layer — gateways, agent runtimes, and model endpoints — is now first-class attack surface, and that cloud-hosted AI services can be patched without any customer action."
  highlights: [CVSS 10.0, missing authentication, no customer action needed]

- title: "AI agent swarm exploits patched PaperCut flaws across ~400 breaches"
  date: "2026-09-13"
  categories: [security, ai-agents]
  tags: [agentic-ai, exploitation, papercut, breach, automation, codex]
  source: "Cloud Security Alliance"
  domain: "labs.cloudsecurityalliance.org"
  link: "https://labs.cloudsecurityalliance.org/research/csa-research-note-papercut-ai-agent-swarm-exploitation-20260/"
  tldr:
    - "A Cloud Security Alliance research note describes a suspected Russian-speaking threat actor that used hundreds of coordinated AI agents, built on an OpenAI Codex-style harness, to exploit already-patched PaperCut vulnerabilities and breach roughly 395 organizations."

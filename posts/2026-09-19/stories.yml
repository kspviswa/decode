- title: "Kubernetes can run AI inference — but can it count the real cost?"
  date: "2026-09-19"
  categories: [cloud-native, distributed-systems]
  tags: [kubernetes, inference, cost, scheduling, kubecon, gpu]
  source: "The New Stack"
  domain: "thenewstack.io"
  link: "https://thenewstack.io/kubernetes-ai-inference-costs/"
  tldr:
    - "A Road to KubeCon roundup examines whether Kubernetes' resource model fits the economics of large-scale AI inference. A WEKA executive argues that inference cost per token depends on state Kubernetes was never designed to manage — request mix, key-value cache occupancy, the balance of prefill and decode, and how memory and bandwidth are consumed inside the accelerator after a pod is already running."
    - "The piece also notes Kubernetes v1.37's storage-hardening features (bind-mount options and emptyDir permissions), CNCF's new AI Inference + Agentic track at KubeCon North America, and a China Merchants Bank case study that unified 99% of its AI compute on Kubernetes, raising average accelerator utilization from 35% to over 60% and cutting the cost of processing one million tokens by 60%."
  why: "Frames the gap between Kubernetes' scheduling model and token-level inference economics — the open question for running AI workloads on cloud-native infrastructure."
  highlights: [token-level cost model, 35% to 60% utilization, KV cache state]

- title: "Chronicle: cut-point replay turns agent incidents into regression tests"
  date: "2026-09-17"
  categories: [llm-agents, ci-cd]
  tags: [testing, reproducibility, agents, continuous-integration, replay]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2609.20625"
  tldr:
    - "Large language model agent failures are hard to reproduce because model responses are non-deterministic, tools read changing state, and multi-step trajectories rarely repeat. Chronicle records an agent run at its non-deterministic boundaries as immutable envelopes and can replay it from the record."
    - "Its central operation, cut-point replay, serves a chosen subset of boundaries from the record and executes the complementary subset live with new code, turning a recorded incident into a regression test that runs in continuous integration. On a benchmark of six recorded failures, recording adds 23 microseconds per boundary crossing, full replay issues zero model calls and is bit-stable across 20 repetitions, and cut-point tests fail on faulty code and pass on guarded and benign changes for all six incidents."
  why: "Brings software-engineering discipline to agent reliability — reproducible regression tests for systems that are inherently non-deterministic."
  highlights: [cut-point replay, 23 µs recording overhead, bit-stable replay]

- title: "Infinite-parameter LLMs: generating and adapting weights from live data"
  date: "2026-09-17"
  categories: [llm, generative]
  tags: [research, weights, continual-learning, hypernetwork, mixture-of-experts]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2609.18842"
  tldr:
    - "Scaling laws assume static pretraining data, but a deployed model faces a world where much of the useful information — facts a user supplies, corrections they give — arrives at run time and is normally stuffed into the prompt and discarded. This paper asks how an architecture could learn from live interaction by writing it into its weights. Taking inspiration from Mixture-of-Experts (MoE), it proposes the Infinite-Parameter LLM: a compact hypernetwork turns run-time data into a low-rank modulation of a shared base network, so feed-forward weights are generated from live data rather than stored in a fixed bank."
    - "Where prior weight generators read the context once and freeze, the authors carry a Bayesian belief over the generator's latent code and update it online, so the effective weight is re-derived from that evolving belief as a session proceeds. The stored footprint stays fixed, yet the weights the model can compile are effectively infinite. The paper specifies an evaluation protocol that tests this against in-context learning and retrieval."
  why: "A genuinely novel architectural direction — carrying run-time knowledge in generated weights rather than the prompt, with implications for continual learning and context economy."
  highlights: [hypernetwork weight generation, online Bayesian update, fixed stored footprint]
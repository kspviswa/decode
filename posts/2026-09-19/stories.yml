- title: "Anthropic's September 2026 threat report: agents on the attack, and industrial-scale distillation"
  date: "2026-09-19"
  categories: [security, ai-security, llm-agents]
  tags: [threat-intelligence, agentic-ai, prompt-injection, distillation, ai-supply-chain, espionage]
  source: "Anthropic"
  domain: "anthropic.com"
  link: "https://www.anthropic.com/threat-intelligence-report-september-2026"
  tldr:
    - "Anthropic's threat intelligence report for September 2026 documents eight months of disrupted misuse across cyber operations, surveillance, influence operations, conventional weapons, and biological misuse. The cyber cases are the most striking: a Russian espionage actor ran AI-driven workflows that automatically rebuilt malware whenever defenders shipped a detection, and financially motivated crews ran multi-agent frameworks that handled reconnaissance, exploitation, and exfiltration while humans only set targets and reviewed results. Anthropic argues that AI has collapsed the labor gap that used to separate state-sponsored operations from individual attackers."
    - "A separate section describes industrial-scale 'illicit distillation': the report says it detected chain-of-thought extraction campaigns by several Chinese labs, including one it attributes to Alibaba that peaked near three million exchanges per day across thousands of fraudulent accounts, plus labs that silently relayed their own users' traffic to Claude. The report recommends treating AI API keys, sandboxes, and agent integrations with the same seriousness as production credentials."
  why: "A primary-source account of how agentic AI is being used offensively, plus a new attack surface — the AI supply chain of keys, gateways, and relay services."
  highlights: [auto-rebuilding malware, ~3M exchanges/day distillation, AI supply chain as target]

- title: "RAFT: a stateful retrieval framework for troubleshooting agents"
  date: "2026-09-17"
  categories: [llm-agents, structured-rag]
  tags: [rag, retrieval, troubleshooting, agents, emnlp]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2609.20754"
  tldr:
    - "RAFT (Retrieval-Augmented Framework for Troubleshooting Agents) treats each closed support case not as a static document but as a directed chain of timeline entries, and retrieves at the entry level. This surfaces historical cases whose intermediate states match the active case and returns the parent-case trajectory anchored at the matched state; an optional case-level graph links related cases through a configurable similarity representation."
    - "Because public multi-stage troubleshooting data is scarce, the authors pair a synthetic benchmark built from Microsoft Learn Windows Server documentation with real Apache Jira issues carrying human duplicate labels. RAFT improves Case Hit over vanilla retrieval-augmented generation (RAG) and GraphRAG baselines at every stage of case progress, with statistically significant gains over the strongest baseline. The benchmark, implementation, and evaluation set are released."
  why: "A concrete advance in structured retrieval — modelling the stateful, multi-stage nature of real troubleshooting instead of flattening cases into documents."
  highlights: [entry-level retrieval, stateful case trajectories, EMNLP 2026 Industry Track]


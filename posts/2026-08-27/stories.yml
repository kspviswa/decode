- title: "GLM-5.3-Flash: Zhipu's 320B-A18B sparse-attention model"
  date: "2026-08-27"
  categories: [open-weights, edge-inference]
  tags: [open-weights, edge-inference, moe, glm, sparse-attention]
  source: "Z.ai"
  domain: "z.ai"
  link: "https://z.ai/blog/glm-5.3-flash"
  tldr:
    - "Zhipu's flash-tier release is a 320B-parameter mixture-of-experts (MoE) model with roughly 18B active, marshaling hybrid sparse and linear attention to slash long-context serving costs, with Manifold-Constrained Hyper-Connections used to improve scaling. It is natively multimodal and carries a 1M-token context."
    - "Unsloth had day-zero support and r/LocalLLaMA's megathread was already deep in quants within hours — a flagship-class open-weight model aimed squarely at cheap long-context inference."
  why: "A flagship open-weight MoE with aggressive sparse attention and a small active parameter count — directly relevant to local and edge inference economics."
  highlights: [320B A18B MoE, sparse attention, 1M context]
- title: "Prefix Sliding: drop stale reasoning tokens to scale test-time compute"
  date: "2026-08-27"
  categories: [edge-inference, local-llm]
  tags: [edge-inference, local-llm, reasoning, test-time-compute]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2608.26070"
  tldr:
    - "Long reasoning traces are the memory bottleneck of test-time scaling, but most intermediate reasoning tokens stop mattering as the model continues. Prefix Sliding discards them, keeping only the instruction prefix and the latest window. Without retraining, existing models run roughly 3x faster at test time at equal performance, and reinforcement-learning (RL) training with Prefix Sliding enables reasoning traces beyond 100k tokens."
    - "Ablations beat both summarizing intermediate tokens and a vanilla sliding window, with code on GitHub."
  why: "A concrete efficiency lever for long-reasoning inference — relevant to serving reasoning models and test-time scaling on constrained hardware."
  highlights: [3x test-time speedup, over-100k reasoning tokens, discard stale tokens]
- title: "How much rank does LoRA need? Rank-error bounds for transformer attention"
  date: "2026-08-27"
  categories: [llm, benchmarks]
  tags: [llm, benchmarks, lora, fine-tuning]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2608.26052"
  tldr:
    - "A task-dependent theory of low-rank adaptation (LoRA) rank selection: it bounds the minimal Kullback-Leibler (KL) error achievable by a rank-r query LoRA update for a given pretrained attention head, target function, and downstream input distribution."
    - "The spectral bounds it derives — and the construction showing softmax saturation can let a smaller rank match attention than would match logits — give fine-tuners something concrete instead of folklore when picking rank, including analysis of fused multi-head LoRA and shared query/key constraints."
  why: "A principled way to pick LoRA rank instead of guessing — relevant to fine-tuning workflows, including local and edge model adaptation."
  highlights: [LoRA rank theory, KL-error bounds, fused multi-head]
- title: "SPFR: semantic potential-field routing for the distributed internet of agents"
  date: "2026-08-27"
  categories: [network-intelligence, llm-agents]
  tags: [network-intelligence, llm-agents, agent-routing, semantics]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2608.25396"
  tldr:
    - "A routing scheme for the emerging 'internet of agents': instead of forwarding messages by fixed address, SPFR routes based on semantic potential fields — agents and tasks are placed in a semantic space and traffic flows toward the agent best matched to the request."
    - "It is a useful direction for agent-to-agent networking and LLM-agent ecosystems, where semantic routing could replace brittle endpoint addressing the way content-based networking did for data."
  why: "A concrete take on semantic routing for agent-to-agent networks — relevant to LLM-agent ecosystems and network-intelligence research."
  highlights: [semantic routing, internet of agents, potential fields]

- title: "AWS acquires DuckLabs — DuckDB stays MIT and open"
  date: "2026-08-27"
  categories: [cloud-native, distributed]
  tags: [cloud-native, distributed, duckdb, open-source]
  source: "DuckLabs"
  domain: "ducklabs.com"
  link: "https://ducklabs.com/news/2026/08/26/ducklabs-to-join-aws"
  tldr:
    - "The bootstrapped Amsterdam company behind DuckDB — a million downloads a day — is joining Amazon Web Services, effective early September, with the team staying together in Amsterdam. Crucially for the data/AI ecosystem, DuckDB, DuckLake, and Quack remain free and MIT-licensed, the nonprofit DuckDB Foundation keeps stewardship, and the extension stack is set to open so third parties can sign and ship extensions."
    - "AWS's quotes read like a commitment letter, but the open-source terms written into the announcement are what builders will hold onto."
  why: "A major open-source data-infrastructure acquisition that keeps the core MIT-licensed — relevant to cloud-native data and the open-source ecosystem."
  highlights: [DuckDB stays MIT, DuckDB Foundation, extension signing]
- title: "mold: a massively parallel linker"
  date: "2026-08-27"
  categories: [cloud-native, distributed]
  tags: [cloud-native, distributed, linker, toolchains]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2608.23228"
  tldr:
    - "A detailed write-up of mold, the massively parallel linker that has become the default linker for many C++ builds. The paper explains how mold parallelizes the traditionally serial linking phases, achieving orders-of-magnitude speedups over GNU ld and linking large programs in a fraction of a second."
    - "It is a concrete study in applying parallelism to a latency-bound systems tool, and a reminder of how much headroom remains in developer tooling."
  why: "A concrete systems-engineering result in massively parallel tooling — relevant to distributed/cloud-native build infrastructure."
  highlights: [parallel linker, build speedup, systems tooling]

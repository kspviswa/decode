- title: "PLCBench: can autonomous LLM agents turn PLC access into sustained physical impact?"
  date: "2026-09-01"
  categories: [llm-agents, ai-security]
  tags: [llm-agents, ai-security, industrial-control, benchmark]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2608.26882"
  tldr:
    - "Industrial control systems rely on programmable logic controllers (PLCs) to link networked computation with physical control, and tool-using LLM agents are an emerging threat: can an autonomous agent convert a network-reachable PLC into sustained adverse physical impact? Existing evaluations stop at digital tasks or individual stages of PLC testing."
    - "PLCBench supplies the first hardware-in-the-loop framework — vendor-native PLC interaction, closed-loop process simulation, and independent outcome verification — and finds that across five LLM families and 240 real-PLC episodes, 31.3% of agents achieved their physical objectives."
  why: "A concrete benchmark for LLM agents with real-world physical consequences — relevant to agent safety, industrial control, and critical infrastructure."
  highlights: [hardware-in-the-loop, 31.3% physical success, 240 PLC episodes]
- title: "Claude Code Opus 5 Auto Mode falls to a 60-80% prompt-injection chain"
  date: "2026-09-01"
  categories: [ai-security, security]
  tags: [ai-security, security, prompt-injection, claude-code]
  source: "Embrace The Red"
  domain: "embracethered.com"
  link: "https://embracethered.com/blog/posts/2026/breaking-claude-code-opus-5-and-automode/"
  tldr:
    - "A deep dive by Johann Rehberger (Embrace The Red) and coverage in The Register show Claude Code Opus 5 in Auto Mode is vulnerable to a prompt-injection chain that achieves code execution with a 60-80% success rate. When a WebFetch fails, Claude can fall back to Bash with curl; a 303 redirect to a malicious ZIP then leads the agent to download and process a hostile payload."
    - "The exploit uses a malicious struct.py that shadows Python's standard library after the archive is unzipped, running code on import. It directly challenges claims of near-zero prompt-injection success in 'Auto Mode'."
  why: "A concrete, high-success-rate injection against a flagship coding agent — a distinct vector from the llms.txt package-squatting story covered on 08-31, worth tracking separately for agent security."
  highlights: [60-80% success, WebFetch→curl fallback, struct.py shadowing]
- title: "Breaking Ambient Trust: in-network per-process access control against lateral movement"
  date: "2026-09-01"
  categories: [security, network-intelligence]
  tags: [security, network-intelligence, lateral-movement, zero-trust]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2608.29979"
  tldr:
    - "Enterprise networks remain vulnerable to advanced persistent threats (APTs) where adversaries gain an initial foothold and move laterally, accumulating access permissions hop by hop. Existing network defenses cannot track user movement at the process level; they grant ambient trust to all processes within a host, so once a host is compromised, malicious processes inherit full network trust."
    - "The paper proposes in-network per-process access control that breaks ambient trust, giving operators a way to constrain what a compromised process can reach on the network."
  why: "A concrete network-security mechanism — relevant to zero-trust architecture and defending agent-managed infrastructure."
  highlights: [per-process ACLs, zero ambient trust, lateral movement]
- title: "RL-based network slice embedding over SDM elastic optical networks"
  date: "2026-09-01"
  categories: [slicing, network-intelligence]
  tags: [slicing, network-intelligence, rl, optical-networks]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2608.29444"
  tldr:
    - "Network slicing over space-division-multiplexed elastic optical networks (SDM-EONs) requires jointly managing spectrum, spatial cores, and compute resources — a coupling many studies ignore by treating compute placement independently from routing and spectrum decisions. That disconnect can allocate spectrum along a path only to have the request fail for lack of compute along that same path."
    - "The paper applies reinforcement learning to slice embedding so routing, spectrum, and compute placement are decided together, addressing the coupling directly."
  why: "A concrete RL result for network slicing — relevant to slice orchestration and autonomous network management."
  highlights: [SDM-EON, joint compute+spectrum, RL embedding]
- title: "SemKV: semantic mixed-precision KV cache quantization guided by the quality cliff"
  date: "2026-09-01"
  categories: [llm, ai-infra]
  tags: [llm, ai-infra, kv-cache, quantization]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2608.28911"
  tldr:
    - "The key-value (KV) cache is the dominant memory bottleneck of long-context LLM inference, growing linearly with context length. The authors show uniform KV quantization on a fractional-bit grid does not degrade gracefully: under a multi-seed statistical protocol, Llama-3.1-8B-Instruct with an affine quantizer is statistically indistinguishable from FP16 KV down to 2.322 code bits per value, then collapses at 2.0 bits — a quality cliff."
    - "SemKV uses that cliff to guide semantic mixed-precision quantization: it assigns more bits where the model is close to collapse and fewer where it has headroom, extending the practical memory envelope for long-context serving."
  why: "A concrete inference-optimization result — relevant to long-context serving and KV-cache memory economics."
  highlights: [quality cliff at 2.0 bits, mixed-precision KV, long-context]
- title: "Pro-Router: token-aware progressive model routing with adaptive edge-cloud collaboration"
  date: "2026-09-01"
  categories: [edge-inference, llm]
  tags: [edge-inference, llm, model-routing, edge-cloud]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2608.28726"
  tldr:
    - "Multimodal large language models (MLLMs) deliver remarkable performance at substantial computational cost, which hurts real-time deployment. Existing model-routing approaches either decide from coarse request-level features alone or spend extra language-model passes inspecting the response, ignoring token-level uncertainty signals that emerge during generation."
    - "Pro-Router uses those in-generation signals to progressively route tokens between a cheap edge model and a stronger cloud model, adapting the split as confidence evolves — a concrete pattern for edge-cloud inference."
  why: "A concrete edge-cloud routing design — relevant to local/edge inference and cost-latency trade-offs in agent workloads."
  highlights: [token-level routing, edge-cloud split, adaptive]
- title: "Selective Forgetting: a graph-based memory framework for long-term LLM agents"
  date: "2026-09-01"
  categories: [llm-agents, ai-agents]
  tags: [llm-agents, ai-agents, agent-memory, knowledge-graph]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2608.28978"
  tldr:
    - "Knowledge graphs have been proposed as a structured alternative to flat retrieval-augmented generation for long-term agent memory, on the assumption that representing conversations as entities and relations improves recall. The authors evaluate that assumption directly: they extract each conversational turn into typed nodes and attributed edges, answer questions from a two-hop subgraph, and periodically prune low-scoring nodes."
    - "The framework treats forgetting as a first-class mechanism — pruning is what keeps memory tractable and relevant over long horizons."
  why: "A concrete structured-memory framework for long-horizon agents — relevant to agent memory, knowledge graphs, and RAG design."
  highlights: [two-hop subgraph recall, periodic pruning, KG memory]
- title: "DoltLite: a SQLite fork with Git-style version control, built with 2,000 agent PRs"
  date: "2026-09-01"
  categories: [cloud-native, distributed]
  tags: [cloud-native, distributed, sqlite, version-control, agent-dev]
  source: "DoltHub"
  domain: "dolthub.com"
  link: "https://www.dolthub.com/blog/2026-08-31-doltlite-beta/"
  tldr:
    - "DoltHub shipped DoltLite as a beta: a SQLite fork that adds Git-style version control — branches, merges, diffs, and time travel — on the SQLite storage engine. The project is notable for how it was built: roughly 2,000 pull requests authored by AI coding agents, with humans reviewing and merging."
    - "It is a concrete data point for both database versioning and agent-driven software development at meaningful scale."
  why: "A concrete distributed-systems and agent-driven-engineering story — relevant to database versioning and how AI agents build real software."
  highlights: [2k agent PRs, Git-on-SQLite, agent-built software]
- title: "Postgres isn't slow — your storage is: local NVMe vs gp3 EBS benchmark"
  date: "2026-09-01"
  categories: [cloud-native, distributed]
  tags: [cloud-native, distributed, postgres, nvme, benchmark]
  source: "ClickHouse"
  domain: "clickhouse.com"
  link: "https://clickhouse.com/blog/posette-talk-recap-postgres-isnt-slow-your-storage-is"
  tldr:
    - "A POSETTE talk recap (Sai Srirampur) benchmarks eight identical PostgreSQL clusters — four on instance-store NVMe and four on baseline gp3 EBS at 3,000 IOPS — to isolate storage as the variable. The finding: Postgres itself is rarely the bottleneck; storage latency and IOPS shape ingestion speed, P95 read latency, and autovacuum behavior."
    - "The article outlines production architectures for running Postgres on local NVMe, a pattern that matters as AI workloads push databases harder."
  why: "A concrete storage-benchmark result — relevant to cloud-native database deployment and AI data-path performance."
  highlights: [gp3 vs NVMe, autovacuum cost, storage-first tuning]
- title: "Hillock: a local neuro-symbolic memory engine for edge agents"
  date: "2026-09-01"
  categories: [edge-inference, llm-agents]
  tags: [edge-inference, llm-agents, agent-memory, hdc]
  source: "GitHub"
  domain: "github.com"
  link: "https://github.com/roandejager/Hillock"
  tldr:
    - "Hillock is a local, gradient-free neuro-symbolic memory engine that combines hyperdimensional computing / vector symbolic architectures with a knowledge graph stored in SQLite, running in under 1.2 GB of VRAM or CPU-only. It answers from the knowledge graph instead of approximate vector matches, and a deterministic similarity gate blocks unanswerable questions rather than guessing."
    - "The design targets edge or resource-constrained agents that need reliable, honest memory without LLM-grade hallucination drift."
  why: "A concrete edge-memory system — relevant to local inference, agent memory, and offline-first agent design."
  highlights: [hyperdimensional computing, SQLite knowledge graph, 1.2GB VRAM]
- title: "ACES: Agentic Continuous Evaluation of Skills — measuring skill lift in enterprise agents"
  date: "2026-09-01"
  categories: [llm-agents, benchmarks]
  tags: [llm-agents, benchmarks, skill-evaluation, enterprise]
  source: "arXiv"
  domain: "arxiv.org"
  link: "https://arxiv.org/abs/2608.20614"
  tldr:
    - "Moving AI agents from prototype to production demands evaluation beyond static code scans. ACES (Agentic Continuous Evaluation of Skills) rigorously assesses individual skills and tools within enterprise agent programs by running paired live trials — one with the target skill enabled, one without — normalizing trajectories, and computing 'Skill Lift': the specific added value of a skill for a given task, harness, and environment."
    - "This is an empirical alternative to checking structural correctness, producing evidence-based decisions on which skills to keep, tune, or drop."
  why: "A concrete framework for evaluating agent skills in production — relevant to agent observability and iterative agent improvement."
  highlights: [A/B skill trials, Skill Lift metric, production evals]